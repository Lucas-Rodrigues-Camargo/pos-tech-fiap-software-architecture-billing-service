apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-billing
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [HOST_PLACEHOLDER]
      secretName: TLS_SECRET_PLACEHOLDER
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /api/budgets
            pathType: Prefix
            backend:
              service:
                name: oficina-billing
                port: { number: 80 }
          - path: /webhooks/mercadopago
            pathType: Prefix
            backend:
              service:
                name: oficina-billing
                port: { number: 80 }
